<!DOCTYPE html>
<html>
<head>
    <title>Money Request 💸</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f0ff;
            padding-top: 100px;
            overflow: hidden;
        }

        .box {
            background: white;
            padding: 35px;
            margin: auto;
            max-width: 350px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #aaa;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 28px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        button:hover {
            transform: scale(1.08);
        }

        #yes {
            background: #7c4dff;
            color: white;
        }

        #no {
            background: #ddd;
        }

        #result {
            display: none;
            font-size: 24px;
            margin-top: 25px;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .confetti {
            position: fixed;
            top: -10px;
            font-size: 22px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.9;
            }
        }
    </style>
</head>

<body>

<div class="box">
    <h1>💰 Do you want money? 💰</h1>

    <button id="yes" onclick="money()">YES 😭</button>
    <button id="no" onclick="noMoney()">NO 🙄</button>

    <div id="result"></div>
</div>

<script>
function money() {
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML =
        "💸 Processing...<br><br>😂 I ALSO WANT MONEY 😭💸";
    launchConfetti();
}

function noMoney() {
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML =
        "😳 WHAT?! You don't want money?";
}

function launchConfetti() {
    const emojis = ["💵", "💸", "🤑", "💰"];
    for (let i = 0; i < 30; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.animationDuration = (2 + Math.random() * 2) + "s";
        piece.style.fontSize = (16 + Math.random() * 16) + "px";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
    }
}
</script>

</body>
</html>
