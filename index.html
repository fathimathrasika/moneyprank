<!DOCTYPE html>
<html>
<head>
    <title>Money Request 💸</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f0ff;
            padding-top: 100px;
        }

        .box {
            background: white;
            padding: 35px;
            margin: auto;
            max-width: 350px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #aaa;
        }

        h1 {
            font-size: 28px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        #yes {
            background: #7c4dff;
            color: white;
        }

        #no {
            background: #ddd;
        }

        #result {
            display: none;
            font-size: 24px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>💰 Do you want money? 💰</h1>

    <button id="yes" onclick="money()">YES 😭</button>
    <button id="no" onclick="noMoney()">NO 🙄</button>

    <div id="result"></div>
</div>

<script>
function money() {
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML =
        "💸 Processing...<br><br>😂 I ALSO WANT MONEY 😭💸";
}

function noMoney() {
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML =
        "😳 WHAT?! You don't want money?";
}
</script>

</body>
</html>
